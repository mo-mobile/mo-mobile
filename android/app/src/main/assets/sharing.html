<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sharing</title>
<style>
  @font-face { font-family: "Chicago7"; src: url("fonts/Chicago.woff2") format("woff2"); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; padding: 24px 16px; background: #c9c9c9 repeating-conic-gradient(#bdbdbd 0 25%, #d4d4d4 0 50%) 0 0/4px 4px;
         font: 16px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; color: #111; min-height: 100vh; }
  .window { max-width: 520px; margin: 0 auto; background: #fff; border: 2px solid #000; box-shadow: 4px 4px 0 #000; }
  .title { font-family: "Chicago7", sans-serif; font-size: 22px; text-align: center; padding: 6px 10px; border-bottom: 2px solid #000;
           background: repeating-linear-gradient(#fff 0 2px, #000 2px 3px); }
  .title span { background: #fff; padding: 0 12px; }
  .body { padding: 16px 18px 18px; }
  button { display: block; width: 100%; text-align: left; font: inherit; color: #000; background: #fff; cursor: pointer;
           border: 2px solid #000; border-radius: 0; box-shadow: 3px 3px 0 #000; padding: 12px 14px; margin: 0 0 14px; }
  button:active { box-shadow: none; transform: translate(3px, 3px); }
  button .name { display: block; font-family: "Chicago7", sans-serif; font-size: 18px; }
  button .what { display: block; font-size: 14px; color: #444; margin-top: 2px; }
  .info { font-size: 14px; color: #444; border-top: 1px solid #ccc; padding-top: 12px; margin-top: 4px; }
  .info b { color: #000; font-weight: 600; }
  .home { text-align: center; }
  .home .name { font-size: 20px; }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .switch { flex: none; width: 58px; height: 30px; border: 2px solid #000; background: #fff; position: relative; box-shadow: 2px 2px 0 #000; }
  .switch i { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: #000; }
  .switch.on { background: #111; } .switch.on i { left: auto; right: 3px; background: #fff; }
  .switch b { position: absolute; font: 12px Chicago7, sans-serif; top: 6px; }
  .switch.on b { left: 7px; color: #fff; } .switch:not(.on) b { right: 6px; }
  .qrbox { border: 2px solid #000; padding: 14px; margin: 0 0 14px; text-align: center; background: #fff; }
  .qrbox svg { display: block; margin: 0 auto 8px; }
  .qrcap { font-size: 13px; color: #444; }
  .row2 { display: flex; gap: 12px; } .row2 button { flex: 1; }
  .busy { opacity: .5; pointer-events: none; }
</style>
</head>
<body>
  <div class="window">
    <div class="title"><span>Sharing</span></div>
    <div class="body">
      <button class="home" onclick="act('back')"><span class="name">‹ Back to Settings</span></button>
      <button class="toggle" id="sharing" onclick="toggle('sharing')"><span><span class="name">Sharing</span>
        <span class="what">Anyone who scans your printer's QR code can print.</span></span>
        <span class="switch"><i></i><b>Off</b></span></button>
      <div class="qrbox" id="qrbox"><div id="qr"></div><div class="qrcap" id="qrcap">Your printer's code. Scan with any phone camera.</div></div>
      <div class="row2">
        <button onclick="act('sticker')"><span class="name">Print sticker</span><span class="what">Print this code to stick on the printer.</span></button>
        <button onclick="act('newcode')"><span class="name">New code</span><span class="what">Old stickers stop working.</span></button>
      </div>
      <button class="toggle" id="push" onclick="toggle('push')"><span><span class="name">Push Notifications</span>
        <span class="what">Get alerted when someone tries to use the Share feature while Sharing is toggled off.</span></span>
        <span class="switch"><i></i><b>Off</b></span></button>
      <div class="info" id="info">Limit: <b>1 print every 10 s</b> per friend<br>Sharing stays on in the background (notification shown) until you turn it off.</div>
    </div>
  </div>
<script src="qrcode.js"></script>
<script>
function act(name) { if (window.MoSharing) MoSharing.action(name); }
function toggle(name) {
  var el = document.getElementById(name);
  var on = !el.querySelector('.switch').classList.contains('on');
  setSwitch(name, on);
  if (window.MoSharing) MoSharing.set(name, on);
}
function setSwitch(name, on) {
  var sw = document.getElementById(name).querySelector('.switch');
  sw.classList.toggle('on', on);
  sw.querySelector('b').textContent = on ? 'On' : 'Off';
}
// The app calls this with fresh values (and after each change).
window.onShare = function (s) {
  setSwitch('sharing', !!s.sharing);
  setSwitch('push', !!s.push);
  var box = document.getElementById('qr');
  if (s.url) {
    var q = qrcode(0, 'M');
    q.addData(s.url);
    q.make();
    box.innerHTML = q.createSvgTag({ cellSize: 5, margin: 0 });
    document.getElementById('qrcap').textContent = "Your printer's code. Scan with any phone camera.";
  } else {
    box.innerHTML = '';
    document.getElementById('qrcap').textContent = s.error || 'Getting your printer’s code…';
  }
};
if (window.MoSharing) window.onShare(JSON.parse(MoSharing.info()));
</script>
</body>
</html>
