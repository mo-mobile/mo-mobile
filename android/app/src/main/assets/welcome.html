<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mo Mobile</title>
<style>
  @font-face { font-family: "Chicago7"; src: url("fonts/Chicago.woff2") format("woff2"); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body { padding: 28px 16px; background: #c9c9c9 repeating-conic-gradient(#bdbdbd 0 25%, #d4d4d4 0 50%) 0 0/4px 4px;
         font: 16px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; color: #111;
         display: flex; flex-direction: column; justify-content: center; min-height: 100vh; }
  .window { max-width: 520px; width: 100%; margin: 0 auto; background: #fff; border: 2px solid #000; box-shadow: 4px 4px 0 #000; }
  .title { font-family: "Chicago7", sans-serif; font-size: 22px; text-align: center; padding: 6px 10px; border-bottom: 2px solid #000;
           background: repeating-linear-gradient(#fff 0 2px, #000 2px 3px); }
  .title span { background: #fff; padding: 0 12px; }
  .body { padding: 18px 18px 20px; }
  .intro { margin: 0 0 16px; text-align: center; color: #333; }
  button { display: block; width: 100%; text-align: left; font: inherit; color: #000; background: #fff; cursor: pointer;
           border: 2px solid #000; border-radius: 10px; box-shadow: 4px 4px 0 #000; padding: 14px 16px; margin: 0 0 18px; }
  button:active { box-shadow: none; transform: translate(4px, 4px); }
  button .name { display: block; font-family: "Chicago7", sans-serif; font-size: 19px; margin-bottom: 4px; }
  button .what { display: block; font-size: 14px; color: #444; }
  .note { font-size: 13px; color: #555; text-align: center; margin: 4px 0 0; }
</style>
</head>
<body>
  <div class="window">
    <div class="title"><span>Mo Mobile</span></div>
    <div class="body">
      <p class="intro">Print Magic cards and tokens from your phone. How do you want to use it?</p>
      <button onclick="choose('local')">
        <span class="name">Everything on this phone</span>
        <span class="what">No server needed. Download the cards you want once and print anywhere, even offline. Tokens alone take a couple of minutes.</span>
      </button>
      <button onclick="choose('server')">
        <span class="name">Connect to a Mo server</span>
        <span class="what">Use cards from a Mo server on your computer or NAS. Scan its QR code, or type its address.</span>
      </button>
      <p class="note">You can switch later: long-press the app icon and tap Change server.</p>
    </div>
  </div>
<script>
function choose(mode) { if (window.MoWelcome) MoWelcome.choose(mode); }
</script>
</body>
</html>
