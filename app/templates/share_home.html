<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mo Mobile</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/favicon-96x96.png') }}" sizes="96x96">
<style>
@font-face{font-family:Chicago7;src:url("{{ url_for('static', filename='fonts/Chicago.woff2') }}") format("woff2")}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{display:flex;align-items:center;justify-content:center;text-align:center;font-family:Chicago7,sans-serif;color:#111;padding:24px;
     background-color:#c9c9c9;background-image:repeating-conic-gradient(#bdbdbd 0 25%,#d4d4d4 0 50%);background-size:4px 4px}
.win{background:#fff;border:1px solid #000;border-bottom:2px solid #000;border-right:2px solid #000;width:340px;max-width:100%}
.tb{font-size:16px;font-weight:bold;min-height:26px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #000;
    background:repeating-linear-gradient(to bottom,#6b6b6b 0,#6b6b6b 1px,#f8f8f8 2px,#f8f8f8 3px)}
.tb span{background:#f8f8f8;padding:0 10px}
.wb{padding:24px 20px 22px}
.logo{position:relative;width:72px;height:72px;margin:0 auto 20px}
.logo b{position:absolute;inset:0;z-index:1;border:2px solid #111;background:#fff;display:flex;align-items:center;justify-content:center;font:bold 34px Chicago7,sans-serif;letter-spacing:-1px;color:#111}
.logo::after{content:'';position:absolute;left:5px;top:5px;width:72px;height:72px;background:repeating-conic-gradient(#111 0 25%,transparent 0 50%) 0 0/2px 2px}
h1{font-size:19px;line-height:1.35;font-weight:normal}
.gh{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));font-size:11px;color:#333}
.gh svg{vertical-align:-2px;margin-right:5px}
</style>
</head>
<body>
<div class="win"><div class="tb"><span>Mo Mobile</span></div><div class="wb">
<div class="logo" aria-hidden="true"><b>Mo</b></div>
<h1>Scan the QR code to start printing</h1>

</div></div>
<a class="gh" href="https://github.com/mo-mobile/mo-mobile" target="_blank" rel="noopener"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>github.com/mo-mobile</a>
</body>
</html>
