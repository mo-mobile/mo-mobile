<style>
  @font-face { font-family: "Chicago7"; src: url("{{ url_for('static', filename='fonts/Chicago.woff2') }}") format("woff2"); }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px; background: #c9c9c9 repeating-conic-gradient(#bdbdbd 0 25%, #d4d4d4 0 50%) 0 0/4px 4px;
         font: 16px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; color: #111; }
  .window { max-width: 560px; margin: 0 auto 20px; background: #fff; border: 2px solid #000; box-shadow: 4px 4px 0 #000; }
  .title { font-family: "Chicago7", sans-serif; font-size: 20px; text-align: center; padding: 6px 10px; border-bottom: 2px solid #000;
           background: repeating-linear-gradient(#fff 0 2px, #000 2px 3px); }
  .title span { background: #fff; padding: 0 10px; }
  .body { padding: 18px 20px 20px; }
  h2 { font-family: "Chicago7", sans-serif; font-size: 17px; font-weight: normal; margin: 18px 0 6px; }
  h2:first-child { margin-top: 0; }
  p { margin: 6px 0; }
  .muted { color: #555; font-size: 14px; }
  .bar { height: 22px; border: 2px solid #000; margin: 10px 0 4px; background: #fff; }
  .bar div { height: 100%; width: 0; background: repeating-linear-gradient(45deg, #000 0 4px, #444 4px 8px); transition: width .4s; }
  .btn { display: block; text-align: center; text-decoration: none; color: #000; background: #fff; font-family: "Chicago7", sans-serif;
         font-size: 18px; padding: 14px; margin: 10px 0; border: 2px solid #000; border-radius: 0; box-shadow: 3px 3px 0 #000; }
  .btn:active { box-shadow: none; transform: translate(3px, 3px); }
  .qr { display: block; width: 240px; height: 240px; margin: 12px auto; image-rendering: pixelated; }
  code { background: #eee; padding: 1px 5px; border-radius: 3px; }
  ol { padding-left: 22px; margin: 6px 0; } li { margin: 8px 0; }
  .ok { font-family: "Chicago7", sans-serif; }
  .choice { display: flex; align-items: flex-start; gap: 6px; margin: 8px 0; }
  .choice .trash-slot { flex: 0 0 52px; display: flex; justify-content: center; padding-top: 0; }
  .choice label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; flex: 1; }
  .choice input { width: 20px; height: 20px; margin: 2px 0 0; flex: 0 0 auto; }
  .choice.have label { cursor: default; }
  .choice.have b { color: #555; }
  .choice .info { display: flex; flex-direction: column; line-height: 1.35; }
  .choice .info .muted { font-size: 14px; }
  .trash { border: 0; background: none; padding: 0 2px; color: #000; cursor: pointer; line-height: 0; }
  .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 1000; background: rgba(0,0,0,.35);
           align-items: center; justify-content: center; }
  .modal .window { width: calc(100% - 56px); max-width: 360px; margin: 0; }
  .modal .body { padding: 16px 18px 18px; }
  .modal-buttons { display: flex; gap: 12px; }
  .modal-buttons .btn { flex: 1; margin: 6px 0 0; }
</style>
