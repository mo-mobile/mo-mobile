# Builds the server image from this repo and publishes it to
# ghcr.io/mo-mobile/mo-mobile, for amd64 (most PCs and NASes) and arm64
# (Apple Silicon Macs, Raspberry Pi). The setup scripts use :latest.
name: Server image

on:
  push:
    branches: [main]
    paths: [app/**, scripts/**, cards_json/**, docker/**, Dockerfile, requirements.txt, .github/workflows/server-image.yml]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/mo-mobile/mo-mobile
          tags: |
            type=raw,value=latest
            type=sha,prefix=
          labels: |
            org.opencontainers.image.title=Mo Mobile
            org.opencontainers.image.description=Mo (Momir Basic printer) server for printing from an Android phone
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
